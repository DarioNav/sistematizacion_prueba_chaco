:var(--text-link-hover)}\n::selection{background:var(--resaltador-400);color:var(--ink-900)}\n:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}\n\n<\u002Fstyle>\n  <script src=\"8297b430-88be-4aa1-9c0a-23e198ccf59f\"><\u002Fscript>\n  <style>\n    html{scroll-behavior:smooth}\n    body{margin:0;background:var(--paper-50);color:var(--ink-700);font-family:var(--font-sans)}\n    a{color:var(--senal-700);text-decoration:underline;text-underline-offset:3px}\n    a:hover{color:var(--ink-900)}\n    td,th{text-align:left;vertical-align:top}\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:var(--paper-50);font-family:var(--font-sans);color:var(--ink-700);font-size:16px;line-height:1.6\">\n  <header style=\"position:sticky;top:0;z-index:20;height:64px;background:rgba(246,243,236,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--paper-300)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:0 24px;height:100%;display:flex;align-items:center;justify-content:space-between;gap:24px\">\n      <a href=\"#top\" style=\"display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink-900)\">\n        <span style=\"width:34px;height:34px;border-radius:50%;background:#1A1714;color:#fff;display:inline-flex;align-items:center;justify-content:center;font:500 12px var(--font-mono)\">[<span style=\"color:#D46A86\">_<\u002Fspan>]<\u002Fspan>\n        <span style=\"font:500 13px var(--font-mono);letter-spacing:.02em\">dn_ia · Clase<\u002Fspan>\n      <\u002Fa>\n      <nav style=\"display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;overflow:hidden;max-height:40px\">\n        <a href=\"#s1\" style=\"{{ navStyle1 }}\">01<\u002Fa>\n        <a href=\"#s2\" style=\"{{ navStyle2 }}\">02<\u002Fa>\n        <a href=\"#s3\" style=\"{{ navStyle3 }}\">03<\u002Fa>\n        <a href=\"#s4\" style=\"{{ navStyle4 }}\">04<\u002Fa>\n        <a href=\"#s5\" style=\"{{ navStyle5 }}\">05<\u002Fa>\n        <a href=\"#s6\" style=\"{{ navStyle6 }}\">06<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div style=\"position:absolute;left:0;bottom:-1px;height:2px;background:var(--senal-500);width:{{ progress }};transition:width .12s linear\"><\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" style=\"position:relative;min-height:600px;display:flex;align-items:flex-end;color:var(--paper-50);background:var(--ink-900)\">\n    <sc-if value=\"{{ heroPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"position:absolute;inset:0;background:url(&quot;8497c46a-952a-48f0-9497-68ad93d596e4&quot;) center/cover;filter:saturate(.85)\"><\u002Fdiv>\n      <div style=\"position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,13,16,.35) 0%,rgba(12,13,16,.88) 75%)\"><\u002Fdiv>\n    <\u002Fsc-if>\n    <div style=\"position:relative;max-width:1200px;width:100%;margin:0 auto;padding:96px 24px 72px;box-sizing:border-box\">\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--senal-300)\">Diplomatura Universitaria en IA Generativa, Transformación Digital y Administración de Justicia<\u002Fdiv>\n      <h1 style=\"font-family:var(--font-display);font-weight:400;font-size:clamp(44px,7vw,88px);line-height:1;letter-spacing:-.015em;margin:18px 0 20px;max-width:960px;text-wrap:balance\">IA para la sistematización y valoración de la <em style=\"color:var(--senal-500)\">prueba<\u002Fem><\u002Fh1>\n      <p style=\"font-size:20px;line-height:1.5;color:var(--paper-100);margin:0;max-width:680px;text-wrap:pretty\">La IA generativa puede ayudar a ordenar y analizar la prueba, pero necesitamos saber qué pedirle y controlar lo que responde.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px 32px;margin-top:36px;font:400 13px var(--font-mono);color:var(--ink-300)\">\n        <span>Virtual<\u002Fspan><span>Martes 3 de noviembre · 18 h<\u002Fspan><span>Lectura previa · Darío Saúl Navarro<a href=\"#nota\" style=\"color:var(--senal-300);text-decoration:none;margin-left:2px\">[1]<\u002Fa><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:20px;margin-top:32px;flex-wrap:wrap\">\n        <a href=\"#s1\" style=\"text-decoration:none\"><x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.Button\" variant=\"accent\" size=\"l\" hint-size=\"200px,48px\">Comenzar la lectura<\u002Fx-import><\u002Fa>\n        <span style=\"font:400 13px var(--font-mono);color:var(--ink-300)\">por @darionavarro.ia<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"border-bottom:1px solid var(--paper-300)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:40px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px\">\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Qué conviene traer<\u002Fspan>\n        <span style=\"color:var(--ink-900)\">Una cuenta (gratuita o paga) en ChatGPT, Claude o Gemini, y ganas de aprender.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:6px\">\n        <span style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Recorrido<\u002Fspan>\n        <span style=\"color:var(--ink-900)\">De la sana crítica a los LLM, la ingeniería de prompts y las pautas del STJ en prescripción adquisitiva.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 01 -->\n  <section id=\"s1\" style=\"scroll-margin-top:64px\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px\">\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--senal-700)\">Sección 01<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1.05;margin:12px 0 40px;max-width:760px;color:var(--ink-900);text-wrap:balance\">Introducción: valorar la prueba, la tarea más <em style=\"color:var(--senal-700)\">humana<\u002Fem><\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px\">\n        <div style=\"display:flex;flex-direction:column;gap:18px;max-width:680px;font-size:17px;text-wrap:pretty\">\n          <p style=\"margin:0\">Valorar la prueba es una de las tareas en las que más se manifiesta la impronta humana y también es una de las más expuestas al error. La valoración probatoria consiste en el análisis crítico e integral de las pruebas para fijar la plataforma fáctica del caso (Quadri, 2011).<\u002Fp>\n          <p style=\"margin:0\">El CPCC de Corrientes manda hacerlo de forma <strong style=\"color:var(--ink-900)\">conjunta<\u002Fstrong> y conforme la <x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.Highlight\" hint-size=\"auto,20px\">sana crítica racional<\u002Fx-import> (art. 236). Esta se basa en las reglas del correcto entendimiento humano, variables con la experiencia pero estables en sus principios lógicos (Couture).<\u002Fp>\n          <p style=\"margin:0\">Es una tarea tan compleja que puede dar lugar a errores. Cabe preguntar si podríamos recurrir a la tecnología, en especial a la IA generativa, para reducir el margen de error humano.<\u002Fp>\n          <h3 style=\"font:600 18px var(--font-sans);color:var(--ink-900);margin:16px 0 0\">De los sistemas expertos a la IA generativa<\u002Fh3>\n          <p style=\"margin:0\">La tecnología ya entró al servicio de justicia hace años: expediente digital, firma digital y “sistemas expertos” como Prometea (MPF de Buenos Aires). Pero estos sistemas trabajan sobre procedimientos estandarizados, donde las variables pueden codificarse en reglas fijas. La valoración probatoria no es así: requiere conocimientos teóricos amplios, flexibilidad de criterio y experiencia en los aspectos cotidianos de la vida.<\u002Fp>\n          <p style=\"margin:0\">Los grandes modelos de lenguaje (LLM) representan una oportunidad. Sin embargo, operan por correlaciones estadísticas, sin acceso directo al significado del mundo real (Corvalán y Carro, 2023).<\u002Fp>\n          <x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.Callout\" kind=\"pregunta\" hint-size=\"100%,80px\">¿Pueden entonces asistir en algo tan delicado como valorar prueba?<\u002Fx-import>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n          <div style=\"background:var(--ink-900);color:var(--paper-50);border-radius:8px;padding:28px\">\n            <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--senal-300)\">La clave<\u002Fdiv>\n            <p style=\"font-family:var(--font-display);font-size:30px;line-height:1.15;margin:10px 0 12px\">Ingeniería de <em style=\"color:var(--senal-500)\">prompts<\u002Fem><\u002Fp>\n            <p style=\"margin:0;color:var(--paper-200)\">El conjunto de técnicas para redactar instrucciones a un LLM y mejorar la calidad de sus respuestas. En la clase vamos a ver si es posible convertir un modelo general como ChatGPT o Claude en un asistente especializado, incorporándole mediante instrucciones la normativa y los criterios jurisprudenciales.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);margin-top:8px\">Pautas clave<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px\">\n            <div style=\"background:#fff;border:1.5px solid var(--ink-900);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s cubic-bezier(.2,.7,.2,1)\" style-hover=\"transform:translateY(-2px);box-shadow:4px 4px 0 var(--ink-900)\">\n              <span style=\"width:28px;height:28px;border-radius:4px;border:1.5px solid var(--ink-900);display:inline-flex;align-items:center;justify-content:center;font:500 13px var(--font-mono);color:var(--ink-900)\">1<\u002Fspan>\n              <strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">La IA asiste, no decide.<\u002Fstrong>\n              <span>Toda delegación decisional queda excluida; el juez valora, firma y responde por su decisión.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#fff;border:1.5px solid var(--ink-900);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s cubic-bezier(.2,.7,.2,1)\" style-hover=\"transform:translateY(-2px);box-shadow:4px 4px 0 var(--ink-900)\">\n              <span style=\"width:28px;height:28px;border-radius:4px;border:1.5px solid var(--ink-900);display:inline-flex;align-items:center;justify-content:center;font:500 13px var(--font-mono);color:var(--ink-900)\">2<\u002Fspan>\n              <strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Lo que no se controla no se usa.<\u002Fstrong>\n              <span>Todo resultado se verifica contra el expediente y las fuentes oficiales.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 -->\n  <section id=\"s2\" style=\"scroll-margin-top:64px;background:var(--paper-100)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px\">\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--senal-700)\">Sección 02<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1.05;margin:12px 0 24px;max-width:760px;color:var(--ink-900);text-wrap:balance\">La paradoja de la <em style=\"color:var(--senal-700)\">automatización<\u002Fem><\u002Fh2>\n      <p style=\"margin:0 0 40px;max-width:680px;font-size:17px;text-wrap:pretty\">Para una máquina, lo difícil para nosotros suele ser fácil, y lo fácil para nosotros, difícil. Goodfellow et al. (2016) llaman así a este fenómeno: las computadoras se destacan en tareas formalmente complejas pero estructuradas (cálculos, clasificación), y históricamente fracasan en tareas que exigen comprensión del contexto, razonamiento flexible y conocimiento del mundo.<\u002Fp>\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);margin-bottom:12px\">Llevado al proceso judicial<\u002Fdiv>\n      <div style=\"overflow-x:auto;background:#fff;border:1px solid var(--paper-300);border-radius:8px\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:560px;font-size:15px\">\n          <sc-raw-thead><sc-raw-tr style=\"border-bottom:1.5px solid var(--ink-900)\">\n            <sc-raw-th style=\"padding:14px 18px;font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Tarea<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding:14px 18px;font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">¿Estructurada?<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding:14px 18px;font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Tecnología tradicional<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-raw-tr style=\"border-bottom:1px solid var(--paper-200)\"><sc-raw-td style=\"padding:14px 18px;color:var(--ink-900);font-weight:600\">Computar un plazo<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px\">Sí: fechas y reglas fijas<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;color:var(--prompt-500)\">Lo resuelve sin dificultad<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr style=\"border-bottom:1px solid var(--paper-200)\"><sc-raw-td style=\"padding:14px 18px;color:var(--ink-900);font-weight:600\">Clasificar expedientes por materia<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px\">Sí: categorías cerradas<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;color:var(--prompt-500)\">Lo resuelve<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n            <sc-raw-tr style=\"background:var(--senal-100)\"><sc-raw-td style=\"padding:14px 18px;color:var(--ink-900);font-weight:600\">Decidir si un testigo es creíble<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px\">No: depende de la experiencia<\u002Fsc-raw-td><sc-raw-td style=\"padding:14px 18px;color:var(--senal-700);font-weight:600\">No podía hacerlo<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n      <p style=\"margin:20px 0 0;max-width:680px;text-wrap:pretty\">La sana crítica reside en este último ejemplo. Por eso, durante décadas, la valoración de la prueba quedó fuera del alcance de la tecnología, que se enfocó en tareas repetitivas y estandarizadas.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;margin-top:64px\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;max-width:680px\">\n          <h3 style=\"font:600 18px var(--font-sans);color:var(--ink-900);margin:0\">Por qué la paradoja empieza a desvanecerse<\u002Fh3>\n          <p style=\"margin:0;text-wrap:pretty\">Los sistemas basados en aprendizaje profundo (redes neuronales) no siguen reglas escritas por un programador. Aprenden de enormes volúmenes de datos y construyen una jerarquía de conceptos, cada uno definido por su relación con otros más simples. De allí surgen los LLM, capaces de leer un testimonio y producir un análisis razonado en lenguaje natural.<\u002Fp>\n          <h3 style=\"font:600 18px var(--font-sans);color:var(--ink-900);margin:16px 0 0\">Lo que los LLM no solucionan<\u002Fh3>\n          <p style=\"margin:0;text-wrap:pretty\">Que la paradoja se debilite no significa que desaparezca. Un LLM puede escribir un fundamento convincente sin haber “entendido” el caso, porque predice palabras probables.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Tres consecuencias prácticas<\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:18px 20px;display:grid;grid-template-columns:32px 1fr;gap:12px\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">A<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Desconfiar de la fluidez.<\u002Fstrong> Un texto bien escrito no es un texto correcto.<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:18px 20px;display:grid;grid-template-columns:32px 1fr;gap:12px\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">B<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Usar a la IA donde es fuerte.<\u002Fstrong> Ordenar, resumir, cronologizar y contrastar pruebas con reglas explícitas.<\u002Fspan><\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:18px 20px;display:grid;grid-template-columns:32px 1fr;gap:12px\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">C<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Reservar al humano donde la máquina es débil.<\u002Fstrong> El juicio final sobre credibilidad, contexto local y máximas de experiencia.<\u002Fspan><\u002Fdiv>\n          <x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.Callout\" kind=\"importante\" label=\"A tener en cuenta\" hint-size=\"100%,96px\" style=\"margin-top:8px\">Cuanto más convirtamos el criterio judicial en reglas explícitas (lo que hace la ingeniería de prompts), más “estructurada” se vuelve la tarea y mejor puede asistirnos la IA.<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 -->\n  <section id=\"s3\" style=\"scroll-margin-top:64px\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px\">\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--senal-700)\">Sección 03<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1.05;margin:12px 0 24px;max-width:760px;color:var(--ink-900);text-wrap:balance\">Introducción a los <em style=\"color:var(--senal-700)\">LLM<\u002Fem><\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:16px;max-width:680px;font-size:17px;text-wrap:pretty\">\n        <p style=\"margin:0\">Un LLM es un programa que <x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.Highlight\" hint-size=\"auto,20px\">predice, palabra por palabra, el texto más probable<\u002Fx-import> a partir de lo que le escribimos. No busca respuestas guardadas en una base de datos: genera texto nuevo con los patrones que aprendió. ChatGPT, Claude o Gemini no son en sí mismos el modelo, sino la interfaz (chatbot) que nos permite conversar con él.<\u002Fp>\n        <p style=\"margin:0\">La IA tradicional clasifica (por ejemplo, detecta correo no deseado); la IA generativa crea (redacta un correo nuevo). Esa diferencia importa: valorar prueba no es encasillar documentos, sino generar fundamentos que vinculen pruebas, hechos y derecho.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);margin:56px 0 16px\">Cómo se “fabrica” un LLM<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px\">\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-1)\">\n          <span style=\"font:500 12px var(--font-mono);color:var(--senal-700)\">Paso 01<\u002Fspan>\n          <strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Preentrenamiento<\u002Fstrong>\n          <span>El modelo lee miles de millones de textos (buena parte de internet) y arma un mapa del lenguaje: palabras, relaciones y significados según el contexto.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-1)\">\n          <span style=\"font:500 12px var(--font-mono);color:var(--senal-700)\">Paso 02<\u002Fspan>\n          <strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Ajuste fino supervisado<\u002Fstrong>\n          <span>Entrenadores humanos le muestran ejemplos para que aprenda a seguir instrucciones.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-1)\">\n          <span style=\"font:500 12px var(--font-mono);color:var(--senal-700)\">Paso 03<\u002Fspan>\n          <strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Alineación (RLHF)<\u002Fstrong>\n          <span>Evaluadores ordenan respuestas por preferencia y el modelo se ajusta para ser útil y seguro.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:24px 0 0;max-width:680px;text-wrap:pretty\">De ese corpus surge un conocimiento general del derecho, pero no especializado en la jurisprudencia de cada provincia. Esa brecha es la que el contexto y un prompt estructurado pueden cubrir. <strong style=\"color:var(--ink-900)\">Ojo:<\u002Fstrong> el prompt no reentrena el modelo, solo cambia su comportamiento en esa conversación.<\u002Fp>\n\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);margin:56px 0 16px\">Cuatro conceptos que debemos conocer<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;background:var(--paper-300);border:1px solid var(--paper-300);border-radius:8px;overflow:hidden\">\n        <div style=\"background:#fff;padding:22px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Token<\u002Fstrong><span style=\"color:var(--ink-500);font-size:15px\">La unidad mínima que procesa el modelo (un fragmento de palabra).<\u002Fspan><span style=\"border-top:1px solid var(--paper-200);padding-top:10px;margin-top:4px;font-size:15px\">El largo de lo que cargamos y de lo que responde se mide en tokens.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;padding:22px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Ventana de contexto<\u002Fstrong><span style=\"color:var(--ink-500);font-size:15px\">La “memoria” de una conversación, con límite de tokens.<\u002Fspan><span style=\"border-top:1px solid var(--paper-200);padding-top:10px;margin-top:4px;font-size:15px\">No se le pueden dar todas las sentencias del STJ; hay que sintetizar los criterios. En expedientes largos, conviene cargar por partes y verificar que “leyó” todo.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;padding:22px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">No determinismo<\u002Fstrong><span style=\"color:var(--ink-500);font-size:15px\">El modelo incorpora cierta aleatoriedad.<\u002Fspan><span style=\"border-top:1px solid var(--paper-200);padding-top:10px;margin-top:4px;font-size:15px\">La misma pregunta puede dar respuestas distintas. Conviene repetir la consulta y comparar los resultados.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;padding:22px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Prompt de sistema<\u002Fstrong><span style=\"color:var(--ink-500);font-size:15px\">Instrucciones fijas que guían al modelo antes de que hablemos.<\u002Fspan><span style=\"border-top:1px solid var(--paper-200);padding-top:10px;margin-top:4px;font-size:15px\">Los “GPTs” de ChatGPT (o los Proyectos de Claude) permiten guardar instrucciones propias y reutilizarlas.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;margin-top:64px\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Los tres riesgos<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding:0 0 16px;border-bottom:1px solid var(--paper-300)\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Opacidad (“caja negra”)<\u002Fstrong><span style=\"text-wrap:pretty\">No sabemos con precisión cómo llega el modelo a su respuesta. Esto choca con el deber de fundamentar, y por eso la IA queda limitada a funciones auxiliares. La investigación en interpretabilidad empieza a abrir esa caja, pero todavía no alcanza.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;padding:0 0 16px;border-bottom:1px solid var(--paper-300)\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Sesgos<\u002Fstrong><span style=\"text-wrap:pretty\">El modelo refleja los datos con que se entrenó y las preferencias de sus evaluadores. En usucapión esto importa: muchos actores son personas de bajos recursos o del ámbito rural. Un modelo sesgado podría exigir documentación de cada año o actos posesorios típicos de la ciudad, desconociendo costumbres rurales.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Alucinaciones<\u002Fstrong><span style=\"text-wrap:pretty\">El modelo puede inventar con total seguridad un hecho, una fecha o un fallo. Es más probable cuando el tema es muy específico y escaso en internet, como la jurisprudencia provincial. En valoración probatoria, una alucinación puede producir exactamente un absurdo: afirmar algo que contradice las constancias de la causa.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--ink-900);color:var(--paper-50);border-radius:8px;padding:28px;display:flex;flex-direction:column;gap:14px;align-self:start\">\n          <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--senal-300)\">Seis reglas para prevenir alucinaciones · Navarro, 2025<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:28px 1fr;gap:12px\"><span style=\"font:500 13px var(--font-mono);color:var(--resaltador-400)\">01<\u002Fspan><span>Mantener el control humano en todas las etapas, del prompt a la verificación.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:28px 1fr;gap:12px\"><span style=\"font:500 13px var(--font-mono);color:var(--resaltador-400)\">02<\u002Fspan><span>Usar la IA solo en materias que uno domina: así puede detectar errores.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:28px 1fr;gap:12px\"><span style=\"font:500 13px var(--font-mono);color:var(--resaltador-400)\">03<\u002Fspan><span>No fundar nunca una decisión exclusivamente en una respuesta de la IA.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:28px 1fr;gap:12px\"><span style=\"font:500 13px var(--font-mono);color:var(--resaltador-400)\">04<\u002Fspan><span>Dividir las tareas complejas en pasos simples.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:28px 1fr;gap:12px\"><span style=\"font:500 13px var(--font-mono);color:var(--resaltador-400)\">05<\u002Fspan><span>Dar contexto detallado: fechas, normas aplicables, precedentes.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:28px 1fr;gap:12px\"><span style=\"font:500 13px var(--font-mono);color:var(--resaltador-400)\">06<\u002Fspan><span>Verificar toda cita en fuentes oficiales.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 -->\n  <section id=\"s4\" style=\"scroll-margin-top:64px;background:var(--paper-100)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px\">\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--senal-700)\">Sección 04<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1.05;margin:12px 0 24px;max-width:760px;color:var(--ink-900);text-wrap:balance\">Ingeniería de prompts <em style=\"color:var(--senal-700)\">aplicada<\u002Fem><\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;gap:16px;max-width:680px;font-size:17px;text-wrap:pretty\">\n        <p style=\"margin:0\">Un buen prompt es una instrucción de trabajo bien redactada, como la que le daríamos a un empleado brillante pero recién ingresado al juzgado (Boonstra, 2025). <x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.Highlight\" hint-size=\"auto,20px\">La calidad de la respuesta depende directamente de la precisión de la instrucción.<\u002Fx-import><\u002Fp>\n        <p style=\"margin:0\">Frente a reentrenar un modelo, no exige conocimientos técnicos ni equipos costosos, se ajusta en minutos y es transparente, porque se lee en lenguaje natural. Es un proceso iterativo: se prueba, se evalúa y se corrige.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);margin:56px 0 16px\">Siete buenas prácticas<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px\">\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px var(--font-mono);color:var(--senal-700)\">01<\u002Fspan><strong style=\"color:var(--ink-900)\">Ser específico sobre el resultado<\u002Fstrong><span style=\"font-size:15px\">Qué quiero, con qué tono y en qué formato (tabla, lista, prosa).<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px var(--font-mono);color:var(--senal-700)\">02<\u002Fspan><strong style=\"color:var(--ink-900)\">Usar el modelo más reciente disponible<\u002Fstrong><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px var(--font-mono);color:var(--senal-700)\">03<\u002Fspan><strong style=\"color:var(--ink-900)\">Dar contexto<\u002Fstrong><span style=\"font-size:15px\">Para qué se usará el resultado, quién lo leerá y qué se considera una tarea bien hecha.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px var(--font-mono);color:var(--senal-700)\">04<\u002Fspan><strong style=\"color:var(--ink-900)\">Evaluar e iterar<\u002Fstrong><span style=\"font-size:15px\">Revisar críticamente y reformular.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px var(--font-mono);color:var(--senal-700)\">05<\u002Fspan><strong style=\"color:var(--ink-900)\">Autorizar a no responder<\u002Fstrong><span style=\"font-size:15px\">“Si la prueba no permite afirmarlo, decí que no surge del expediente y no completes con suposiciones.”<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px var(--font-mono);color:var(--senal-700)\">06<\u002Fspan><strong style=\"color:var(--ink-900)\">Preferir instrucciones positivas<\u002Fstrong><span style=\"font-size:15px\">“Analizá primero todas las pruebas y recién después concluí” funciona mejor que “no concluyas rápido”.<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:18px 20px;display:flex;flex-direction:column;gap:6px\"><span style=\"font:500 12px var(--font-mono);color:var(--senal-700)\">07<\u002Fspan><strong style=\"color:var(--ink-900)\">Ordenar con etiquetas<\u002Fstrong><span style=\"font-size:15px\">Títulos con # (Markdown) o etiquetas tipo &lt;pruebas&gt;…&lt;/pruebas&gt; (XML) para separar contexto, reglas y datos.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);margin:64px 0 16px\">Las técnicas, con ejemplos jurídicos<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:24px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ techniques }}\" as=\"t\" hint-placeholder-count=\"6\">\n            <button type=\"button\" sc-camel-on-click=\"{{ t.select }}\" style=\"{{ t.style }}\">\n              <span style=\"font:600 16px var(--font-sans)\">{{ t.name }}<\u002Fspan>\n              <span style=\"font-size:14px;opacity:.85\">{{ t.desc }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;position:sticky;top:88px\">\n          <x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.PromptBlock\" title=\"{{ techTitle }}\" lines=\"{{ techLines }}\" hint-size=\"100%,160px\"><\u002Fx-import>\n          <span style=\"font:400 13px var(--font-mono);color:var(--ink-500)\">Elegí una técnica para ver el ejemplo en valoración de prueba.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;margin-top:72px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <h3 style=\"font-family:var(--font-display);font-weight:400;font-size:32px;line-height:1.1;margin:0;color:var(--ink-900)\">La arquitectura de un prompt eficaz<\u002Fh3>\n          <p style=\"margin:0;text-wrap:pretty\">Laredo et al. (2024) proponen este orden de componentes. Puede usarse como plantilla:<\u002Fp>\n          <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--paper-300)\">\n            <div style=\"display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper-300)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">01<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Rol:<\u002Fstrong> quién es el asistente y en qué materia trabaja.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper-300)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">02<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Tono:<\u002Fstrong> formal, claro, técnico cuando haga falta.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper-300)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">03<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Datos de fondo:<\u002Fstrong> los escritos y las pruebas.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper-300)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">04<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Tarea y reglas detalladas:<\u002Fstrong> cómo debe trabajar (aquí van los criterios del STJ).<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper-300)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">05<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Ejemplos:<\u002Fstrong> fundamentos modelo.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper-300)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">06<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Pedido concreto:<\u002Fstrong> qué hacer ahora.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper-300)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">07<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Pensar paso a paso.<\u002Fstrong><\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper-300)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">08<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Formato de salida:<\u002Fstrong> tabla, secciones, extensión.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--paper-300)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-700)\">09<\u002Fspan><span><strong style=\"color:var(--ink-900)\">Respuesta predefinida<\u002Fstrong> (opcional): cómo empezar o qué estructura respetar.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.PromptBlock\" title=\"Plantilla · valoración de prueba en usucapión\" lines=\"{{ templateLines }}\" hint-size=\"100%,420px\"><\u002Fx-import>\n          <x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.Callout\" kind=\"importante\" label=\"A tener en cuenta\" hint-size=\"100%,96px\">El prompt es el lugar donde el abogado vuelca lo que sabe. Un buen prompt no es un truco informático: es conocimiento jurídico ordenado.<\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 -->\n  <section id=\"s5\" style=\"scroll-margin-top:64px\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px\">\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--senal-700)\">Sección 05<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1.05;margin:12px 0 24px;max-width:860px;color:var(--ink-900);text-wrap:balance\">Pautas de valoración probatoria del STJ en prescripción <em style=\"color:var(--senal-700)\">adquisitiva<\u002Fem><\u002Fh2>\n      <p style=\"margin:0;max-width:680px;font-size:17px;text-wrap:pretty\">En la segunda parte de la clase vamos a ver algunas de las pautas fijadas por el Superior Tribunal de Justicia de Corrientes (STJ).<\u002Fp>\n      <p style=\"font-family:var(--font-display);font-size:30px;line-height:1.2;color:var(--ink-900);margin:40px 0;max-width:860px;padding-left:24px;border-left:1.5px solid var(--ink-900);text-wrap:pretty\">El STJ exige una prueba compuesta, valorada en conjunto, que genere certeza sobre <em style=\"color:var(--senal-700)\">20 años<\u002Fem> de posesión calificada.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;max-width:680px;text-wrap:pretty\">\n          <h3 style=\"font:600 18px var(--font-sans);color:var(--ink-900);margin:0\">Lo que hay que probar<\u002Fh3>\n          <p style=\"margin:0\">La prescripción adquisitiva larga exige posesión (corpus y animus domini, art. 1909 CCyC), durante 20 años sin necesidad de justo título ni buena fe (art. 1899), sobre un objeto prescriptible. La posesión debe ser pública, pacífica, continua e ininterrumpida (art. 1900). Los actos posesorios típicos están en el art. 1928: cultura, percepción de frutos, amojonamiento, mejoras, exclusión de terceros.<\u002Fp>\n          <p style=\"margin:0\">El gran desafío probatorio es demostrar que el actor no fue un mero tenedor (inquilino, comodatario, ocupante tolerado), sino que <x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.Highlight\" hint-size=\"auto,20px\">se comportó como dueño<\u002Fx-import>. La Ley 14.159 (art. 24 inc. c) admite toda clase de pruebas, pero el fallo no puede basarse solo en testigos, y manda considerar especialmente el pago de impuestos.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Dos principios rectores<\u002Fdiv>\n          <div style=\"background:#fff;border:1.5px solid var(--ink-900);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px\">\n            <strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Prueba compuesta e integración<\u002Fstrong>\n            <span style=\"text-wrap:pretty\">Las pruebas se valoran con visión de conjunto, no descartándolas una por una. El STJ calificó de “método equivocado” ir excluyendo cada prueba aislada para concluir que solo queda la testimonial (Sent. Civ. N° 23/2022, “Bernal c/ Abraham”; reiterado en N° 56/2025). No hace falta que cada dicho de un testigo esté corroborado: basta que el conjunto refleje el inicio y la continuidad de la posesión.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1.5px solid var(--ink-900);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px\">\n            <strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Certeza reforzada<\u002Fstrong>\n            <span style=\"text-wrap:pretty\">Por estar en juego el orden público y la extinción del dominio del titular registral, solo se admite la demanda cuando la prueba lleva “absoluta certeza” al juzgador (Sent. Civ. N° 216/2024). En la duda, se rechaza.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:64px 0 16px\">\n        <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Reglas por tipo de prueba · {{ pautasCount }}<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n          <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"8\">\n            <button type=\"button\" sc-camel-on-click=\"{{ f.select }}\" style=\"{{ f.style }}\">{{ f.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"overflow-x:auto;background:#fff;border:1px solid var(--paper-300);border-radius:8px\">\n        <sc-raw-table style=\"width:100%;border-collapse:collapse;min-width:640px;font-size:15px\">\n          <sc-raw-thead><sc-raw-tr style=\"border-bottom:1.5px solid var(--ink-900)\">\n            <sc-raw-th style=\"padding:14px 18px;width:190px;font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Prueba<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding:14px 18px;font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Pauta del STJ<\u002Fsc-raw-th>\n            <sc-raw-th style=\"padding:14px 18px;width:150px;font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500)\">Sent. Civ. N°<\u002Fsc-raw-th>\n          <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n          <sc-raw-tbody>\n            <sc-for list=\"{{ pautas }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <sc-raw-tr style=\"border-bottom:1px solid var(--paper-200)\">\n                <sc-raw-td style=\"padding:14px 18px;color:var(--ink-900);font-weight:600\">{{ p.tipo }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:14px 18px;text-wrap:pretty\">{{ p.pauta }}<\u002Fsc-raw-td>\n                <sc-raw-td style=\"padding:14px 18px;font:400 13px var(--font-mono);color:var(--ink-600)\">{{ p.sent }}<\u002Fsc-raw-td>\n              <\u002Fsc-raw-tr>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-tbody>\n        <\u002Fsc-raw-table>\n      <\u002Fdiv>\n\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-500);margin:64px 0 16px\">Pautas sobre la posesión y el tiempo<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px\">\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-1)\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Actos posesorios distribuidos<\u002Fstrong><span style=\"text-wrap:pretty\">No necesitan ser permanentes: pueden repartirse a lo largo del plazo y se valoran integradamente (N° 9/2025). Edificar sin pedir autorización al titular revela ánimo de dueño (N° 23/2022).<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-1)\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Exclusividad<\u002Fstrong><span style=\"text-wrap:pretty\">No pueden concurrir dos posesiones del mismo carácter sobre el mismo bien (N° 25/2024; art. 1913 CCyC).<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-1)\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Interversión<\u002Fstrong><span style=\"text-wrap:pretty\">Quien entró como tenedor u ocupante debe probar de modo categórico cuándo empezó a poseer para sí (N° 181/2022); entre coherederos se exigen actos públicos e inequívocos (N° 117/2023).<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-1)\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Interrupción<\u002Fstrong><span style=\"text-wrap:pretty\">La reconvención por reivindicación interrumpe la prescripción (N° 150/2023; art. 2546 CCyC); la mera negativa al contestar, no, y el tiempo del proceso puede computarse (N° 9/2025).<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-1)\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Continuidad presumida<\u002Fstrong><span style=\"text-wrap:pretty\">Acreditada la adquisición de la posesión, se presume su continuidad; quien lo niegue debe probarlo (N° 5/2025; art. 1930 CCyC).<\u002Fspan><\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid var(--paper-300);border-radius:8px;padding:22px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-1)\"><strong style=\"font:600 18px var(--font-sans);color:var(--ink-900)\">Accesión<\u002Fstrong><span style=\"text-wrap:pretty\">La cesión de derechos posesorios instrumentada con firma certificada permite unir posesiones (N° 56/2025; art. 1901 CCyC).<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <x-import component-from-global-scope=\"ClasesIADesignSystem_f28577.Callout\" kind=\"importante\" label=\"A tener en cuenta\" hint-size=\"100%,80px\" style=\"margin-top:24px;max-width:760px\">Cada fila de esta tabla puede convertirse en una regla del prompt. El conocimiento jurisprudencial, sintetizado, es lo que “especializa” a la IA.<\u002Fx-import>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 06 -->\n  <section id=\"s6\" style=\"scroll-margin-top:64px;background:var(--ink-900);color:var(--paper-50)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:96px 24px\">\n      <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--senal-300)\">Sección 06<\u002Fdiv>\n      <h2 style=\"font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1.05;margin:12px 0 40px;max-width:760px;color:var(--paper-50)\">Para llevar a la <em style=\"color:var(--senal-500)\">clase<\u002Fem><\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:48px;align-items:start\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-300)\">Advertencias finales<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--ink-700)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-300)\">01<\u002Fspan><span>La IA es una herramienta auxiliar: la decisión y la firma son humanas.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--ink-700)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-300)\">02<\u002Fspan><span>Nunca cargues datos personales de partes o terceros en herramientas abiertas.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--ink-700)\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-300)\">03<\u002Fspan><span>Verificá toda cita de jurisprudencia o doctrina en fuentes oficiales.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0\"><span style=\"font:500 13px var(--font-mono);color:var(--senal-300)\">04<\u002Fspan><span>Declará el uso de IA cuando corresponda; varios superiores tribunales del país ya regularon su uso responsable.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showGlossary }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font:500 11px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-300)\">Glosario mínimo<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--ink-700)\">\n              <div style=\"display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-700);font-size:15px\"><strong style=\"color:var(--resaltador-400);font-weight:500\">LLM<\u002Fstrong><span>Gran modelo de lenguaje: programa que genera texto prediciendo la palabra más probable.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-700);font-size:15px\"><strong style=\"color:var(--resaltador-400);font-weight:500\">IA generativa<\u002Fstrong><span>IA que crea contenido nuevo (texto, imágenes, código) a partir de instrucciones.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-700);font-size:15px\"><strong style=\"color:var(--resaltador-400);font-weight:500\">Prompt<\u002Fstrong><span>La instrucción o pregunta que le damos al modelo.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-700);font-size:15px\"><strong style=\"color:var(--resaltador-400);font-weight:500\">Prompt de sistema<\u002Fstrong><span>Instrucciones fijas que guían al modelo en toda la conversación.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-700);font-size:15px\"><strong style=\"color:var(--resaltador-400);font-weight:500\">GPT personalizado<\u002Fstrong><span>Asistente de ChatGPT con instrucciones propias guardadas.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-700);font-size:15px\"><strong style=\"color:var(--resaltador-400);font-weight:500\">Token<\u002Fstrong><span>Fragmento mínimo de texto que procesa el modelo.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-700);font-size:15px\"><strong style=\"color:var(--resaltador-400);font-weight:500\">Ventana de contexto<\u002Fstrong><span>Límite de lo que el modelo puede “recordar” en una conversación.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-700);font-size:15px\"><strong style=\"color:var(--resaltador-400);font-weight:500\">Alucinación<\u002Fstrong><span>Información inexacta presentada con apariencia verosímil.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-700);font-size:15px\"><strong style=\"color:var(--resaltador-400);font-weight:500\">Unidad de valoración<\u002Fstrong><span>Fundamento parcial que valora una prueba o un conjunto de pruebas respecto de un requisito.<\u002Fspan><\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:16px;padding:12px 0;border-bottom:1px solid var(--ink-700);font-size:15px\"><strong style=\"color:var(--resaltador-400);font-weight:500\">Prueba compuesta<\u002Fstrong><span>Valoración conjunta de pruebas diversas que, integradas, acreditan la posesión.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <p style=\"font-family:var(--font-display);font-size:40px;line-height:1.1;margin:80px 0 0;max-width:820px;text-wrap:balance\">La IA asiste, <em style=\"color:var(--senal-500)\">no decide<\u002Fem>. Lo que no se controla, no se usa.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer id=\"nota\" style=\"background:var(--ink-950);color:var(--ink-300);scroll-margin-top:64px\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:40px 24px;display:flex;flex-direction:column;gap:16px;font-size:13px;line-height:1.6\">\n      <p style=\"margin:0;max-width:860px;text-wrap:pretty\"><span style=\"font-family:var(--font-mono);color:var(--senal-300)\">[1]<\u002Fspan> Fuente: Navarro, D. (2026). <em>IA Generativa como Asistente en la Valoración Probatoria en Juicios de Prescripción Adquisitiva. Evaluación Experimental del Rendimiento de un GPT Afinado con Ingeniería de Prompts<\u002Fem> [Tesis de Maestría en Magistratura y Función Judicial, Universidad Nacional del Nordeste; director: José Osvaldo Ledesma]. Trabajo inédito. Uso de IA: este resumen fue elaborado por el docente con asistencia de Claude (Anthropic), y revisado antes de su envío.<\u002Fp>\n      <div style=\"display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-family:var(--font-mono);font-size:12px;border-top:1px solid var(--ink-800);padding-top:16px\">\n        <span>Darío Saúl Navarro · @darionavarro.ia<\u002Fspan><span>Corrientes, noviembre de 2026<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroPhoto&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Portada&quot;},&quot;showGlossary&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Contenido&quot;}}\">\nconst TECH = [\n  { name: 'Zero-shot', desc: 'Una pregunta sin ejemplos.', lines: ['¿Estas pruebas acreditan 20 años de posesión?'] },\n  { name: 'Few-shot', desc: 'Dar 3 a 5 ejemplos del resultado esperado.', lines: ['A continuación tenés tres fundamentos de sentencias reales:', '<ejemplo_1>[fundamento — completar]<\u002Fejemplo_1>', '<ejemplo_2>[fundamento — completar]<\u002Fejemplo_2>', '<ejemplo_3>[fundamento — completar]<\u002Fejemplo_3>', 'Valorá la prueba del caso siguiendo la misma forma de razonar.'] },\n  { name: 'Cadena de pensamiento (CoT)', desc: 'Pedir que razone paso a paso antes de concluir.', lines: ['Analizá cada prueba por separado, luego en conjunto, y recién entonces concluí.'] },\n  { name: 'Autorreflexión', desc: 'Pedir que revise su propio razonamiento.', lines: ['Antes de concluir, verificá si alguna prueba contradice tu conclusión.'] },\n  { name: 'De lo simple a lo complejo', desc: 'Dividir el problema en subproblemas encadenados (least-to-most).', lines: ['Paso 1: identificá los hechos alegados.', 'Paso 2: relacioná cada hecho con la prueba que lo respalda.', 'Paso 3: computá el plazo de posesión acreditado.'] },\n  { name: 'Metaprompting', desc: 'Pedirle a la IA que mejore nuestro prompt.', lines: ['Revisá estas instrucciones y sugerí mejoras para que la valoración sea más precisa.', '<instrucciones>[tu prompt — completar]<\u002Finstrucciones>'] }\n];\nconst PAUTAS = [\n  ['Testimonial', 'No alcanza por sí sola; debe estar respaldada por otros medios durante un período razonable.', '58/2020; 233/2025'],\n  ['Testimonial', 'Calificar si hubo posesión o mera ocupación es tarea del juez, no de los testigos.', '105/2004; 80/2017'],\n  ['Testimonial', 'Pesa cómo sabe el testigo lo que declara, su vínculo e interés; testigos dependientes o amigos del actor requieren corroboración.', '211/2024'],\n  ['Testimonial', 'Las divergencias menores no excluyen el testimonio si hay coherencia en lo sustancial.', '56/2025'],\n  ['Documental', 'Debe cubrir una parte considerable del plazo, aunque no todo.', '150/2023'],\n  ['Documental', 'La firma certificada hace plena fe; la copia simple es solo un indicio que puede cobrar valor en el contexto.', '117/2023; 294/2024'],\n  ['Documental', 'Las actas de nacimiento de los hijos prueban el domicilio a esa fecha.', '126/2023'],\n  ['Impuestos y servicios', 'Valor complementario, no decisivo: un simple tenedor también puede pagarlos.', '216/2024; 155/2021'],\n  ['Impuestos y servicios', 'La fecha de pago es determinante: pagos hechos poco antes de demandar o aislados no prueban 20 años.', '123/2023; 100/2024'],\n  ['Informes', 'Deben decir quién paga y desde cuándo; la mera conexión del servicio no fija el inicio de la posesión.', '100/2024; 15/2025'],\n  ['Informes', 'El cambio de titularidad del servicio a nombre del actor puede probar la interversión y el inicio de la posesión.', '9/2025'],\n  ['Pericial', 'El dictamen fundado y uniforme se sigue salvo argumentos técnicos en contra; puede datar mejoras con imágenes satelitales.', '170/2022; 89/2025'],\n  ['Reconocimiento judicial', 'Muestra el estado actual, pero no la antigüedad ni quién hizo las mejoras.', '15/2025'],\n  ['Confesión ficta', 'No tiene valor absoluto: debe corroborarse con otras pruebas.', '167/2025']\n];\nconst FILTERS = ['Todas', 'Testimonial', 'Documental', 'Impuestos y servicios', 'Informes', 'Pericial', 'Reconocimiento judicial', 'Confesión ficta'];\nconst TEMPLATE = [\n  '# Rol: Sos un asistente jurídico especializado en prescripción adquisitiva, que trabaja con los criterios del STJ de Corrientes.',\n  '# Tono: formal, claro, técnico cuando haga falta.',\n  '# Datos de fondo: <escritos>[demanda y contestación — completar]<\u002Fescritos> <pruebas>[prueba producida — completar]<\u002Fpruebas>',\n  '# Tarea y reglas: valorá la prueba en conjunto y conforme la sana crítica racional (art. 236 CPCC). <criterios>[pautas del STJ — completar]<\u002Fcriterios>',\n  '# Ejemplos: <ejemplos>[fundamentos modelo — completar]<\u002Fejemplos>',\n  '# Pedido: determiná si la prueba acredita 20 años de posesión pública, pacífica, continua e ininterrumpida.',\n  '# Pensá paso a paso: analizá cada prueba por separado, luego en conjunto, y recién entonces concluí.',\n  '# Formato: tabla Prueba | Requisito | Valoración, y una conclusión final breve.',\n  'Si la prueba no permite afirmarlo, decí que no surge del expediente y no completes con suposiciones.'\n];\nclass Component extends DCLogic {\n  state = { tech: 2, filter: 'Todas', progress: 0, active: 0 };\n  componentDidMount() {\n    this._on = () => {\n      const d = document.documentElement, max = d.scrollHeight - innerHeight;\n      let active = 0;\n      for (let i = 1; i <= 6; i++) { const el = document.getElementById('s' + i); if (el && el.getBoundingClientRect().top < 140) active = i; }\n      this.setState({ progress: max > 0 ? Math.min(100, scrollY / max * 100) : 0, active });\n    };\n    addEventListener('scroll', this._on, { passive: true }); this._on();\n  }\n  componentWillUnmount() { removeEventListener('scroll', this._on); }\n  renderVals() {\n    const { tech, filter } = this.state;\n    const techniques = TECH.map((t, i) => {\n      const on = i === tech;\n      return {\n        name: t.name, desc: t.desc, title: 'Ejemplo · ' + t.name, lines: t.lines,\n        select: () => this.setState({ tech: i }),\n        style: {\n          display: 'flex', flexDirection: 'column', gap: '4px', textAlign: 'left', cursor: 'pointer',\n          padding: '14px 18px', borderRadius: '8px', fontFamily: 'var(--font-sans)',\n          background: on ? 'var(--ink-900)' : '#fff', color: on ? 'var(--paper-50)' : 'var(--ink-700)',\n          border: on ? '1.5px solid var(--ink-900)' : '1px solid var(--paper-300)',\n          boxShadow: on ? '3px 3px 0 var(--senal-500)' : 'none',\n          transition: 'all .18s cubic-bezier(.2,.7,.2,1)'\n        }\n      };\n    });\n    const filters = FILTERS.map(f => {\n      const on = f === filter;\n      return {\n        label: f, select: () => this.setState({ filter: f }),\n        style: {\n          cursor: 'pointer', padding: '6px 12px', borderRadius: '999px', fontFamily: 'var(--font-sans)', fontSize: '13px',\n          background: on ? 'var(--ink-900)' : '#fff', color: on ? 'var(--paper-50)' : 'var(--ink-700)',\n          border: on ? '1.5px solid var(--ink-900)' : '1px solid var(--paper-300)'\n        }\n      };\n    });\n    const pautas = PAUTAS.filter(p => filter === 'Todas' || p[0] === filter).map(p => ({ tipo: p[0], pauta: p[1], sent: p[2] }));\n    return {\n      heroPhoto: this.props.heroPhoto ?? true,\n      showGlossary: this.props.showGlossary ?? true,\n      techniques,\n      progress: this.state.progress.toFixed(1) + '%',\n      ...Object.fromEntries([1,2,3,4,5,6].map(i => { const on = this.state.active === i; return ['navStyle' + i, { font: '500 12px var(--font-mono)', textDecoration: 'none', padding: '6px 8px', borderRadius: '4px', color: on ? 'var(--paper-50)' : 'var(--ink-600)', background: on ? 'var(--ink-900)' : 'transparent', transition: 'all .18s cubic-bezier(.2,.7,.2,1)' }]; })),\n      techTitle: 'Ejemplo · ' + TECH[tech].name,\n      techLines: TECH[tech].lines,\n      templateLines: TEMPLATE,\n      filters, pautas,\n      pautasCount: pautas.length + (pautas.length === 1 ? ' pauta' : ' pautas')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
